# Configuración Cloudflare Workers (plan gratuito).
# Despliegue: npx wrangler deploy   (requiere: wrangler d1 create / r2 bucket create
# y los secrets: CERT_PEM, CERT_KEY, SOL_USUARIO, SOL_CLAVE)

name = "irazola-facturacion"
main = "src/worker.ts"
compatibility_date = "2026-08-01"
# xml-crypto usa node:crypto; nodejs_compat lo habilita en Workers.
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./public"
# La API y la vista pública del comprobante pasan por el Worker; el resto se
# sirve como estático (PWA).
run_worker_first = ["/api/*", "/ver/*"]

[vars]
SUNAT_AMBIENTE = "beta"
# 'individual' (beta/pruebas: boletas por sendBill) | 'resumen' (producción:
# boletas por Resumen Diario nocturno).
MODO_ENVIO_BOLETAS = "individual"
# API REST de Guías de Remisión: 'prueba' (servidor de pruebas de la
# comunidad) | 'produccion'. Los secrets GRE_CLIENT_ID / GRE_CLIENT_SECRET se
# generan en SOL -> Credenciales API.
GRE_AMBIENTE = "prueba"
# Número de registro MTC del transportista (vacío si no aplica).
GRE_REGISTRO_MTC = ""
# Datos del emisor. En producción se reemplaza por los datos reales del RUC.
EMPRESA_JSON = '{"ruc":"20000000001","razonSocial":"TURISMO IRAZOLA S.A.C.","nombreComercial":"Turismo Irazola","ubigeo":"250101","departamento":"UCAYALI","provincia":"CORONEL PORTILLO","distrito":"CALLERIA","direccion":"JR. DE PRUEBA NRO. 123"}'

# Workers AI (capa gratuita diaria): modelo de visión para el escaneo asistido
# de notas en papel (OCR). No requiere tarjeta.
[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "irasola-facturacion"
database_id = "f5bf9def-2b52-4537-abf9-42408709e7cd"

# Los archivos (XML firmados y CDR) se guardan en la tabla `archivos` de D1:
# así no hace falta habilitar R2 (que pide tarjeta) y el costo sigue en cero.

[triggers]
# Cada hora: reintentos de envíos y consulta de tickets de resúmenes.
# 03:00 UTC (22:00 en Perú): Resumen Diario de boletas del día.
crons = ["0 * * * *", "0 3 * * *"]
